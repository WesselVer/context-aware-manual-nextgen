<?xml version="1.0" encoding="UTF-8"?>
<!-- Smart Manual controls poster, A3 landscape (420 x 297 mm). 1 unit = 1 CSS px at 96 dpi.
     Fonts: Barlow and Barlow Semi Condensed (free, Google Fonts); install them before editing. -->
<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 1587 1123" font-family="Barlow, sans-serif">

<g id="Background">
<rect x="0" y="0" width="1587" height="1123" fill="#F2F3F5"/>
</g>

<g id="Header">
<text x="64" y="84" font-family="'Barlow Semi Condensed', sans-serif" font-size="26" font-weight="700" letter-spacing="2.1" fill="#171A20">SMART MANUAL</text>
<text x="282" y="84" font-size="19" fill="#5C5E62">Context-aware driving guide</text>
<text x="60" y="164" font-family="'Barlow Semi Condensed', sans-serif" font-size="80" font-weight="700" fill="#171A20">Know your controls</text>
</g>

<g id="Evaluation-QR-codes">
<g id="Pre-evaluation">
<text x="879" y="96" font-size="13" font-weight="700" letter-spacing="1.1" fill="#3E6AE1">BEFORE YOU DRIVE</text>
<text x="879" y="122" font-size="22" font-weight="700" fill="#171A20">Pre-evaluation</text>
<text x="879" y="146" font-size="16" fill="#5C5E62">Scan with your phone</text>
<g id="QR-pre">
<rect x="1065" y="56" width="116" height="116" rx="12" fill="#FFFFFF" stroke="#A2A3A5" stroke-width="2" stroke-dasharray="6 5"/>
<text x="1123" y="119" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1" fill="#767676">QR CODE</text>
</g>
</g>
<g id="Post-evaluation">
<text x="1221" y="96" font-size="13" font-weight="700" letter-spacing="1.1" fill="#3E6AE1">AFTER YOU DRIVE</text>
<text x="1221" y="122" font-size="22" font-weight="700" fill="#171A20">Post-evaluation</text>
<text x="1221" y="146" font-size="16" fill="#5C5E62">Scan with your phone</text>
<g id="QR-post">
<rect x="1407" y="56" width="116" height="116" rx="12" fill="#FFFFFF" stroke="#A2A3A5" stroke-width="2" stroke-dasharray="6 5"/>
<text x="1465" y="119" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1" fill="#767676">QR CODE</text>
</g>
</g>
</g>

<g id="Steering-wheel">
<rect x="64.5" y="196.5" width="439" height="564" rx="20" fill="#FFFFFF" stroke="#E4E5E7"/>
<text x="92" y="236" font-size="15" font-weight="700" letter-spacing="1.2" fill="#5C5E62">STEERING WHEEL</text>
<g id="Wheel-drawing" transform="translate(134 254)">
<g transform="rotate(-38 58 52)"><rect x="30" y="42" width="56" height="20" rx="8" fill="#3E6AE1"/></g>
<g transform="rotate(38 242 52)"><rect x="214" y="42" width="56" height="20" rx="8" fill="#3E6AE1"/></g>
<path d="M60 124 H240 M150 140 V212" fill="none" stroke="#D0D1D2" stroke-width="24" stroke-linecap="round"/>
<circle cx="150" cy="120" r="98" fill="none" stroke="#A2A3A5" stroke-width="18"/>
<circle cx="150" cy="126" r="30" fill="#F2F3F5" stroke="#D0D1D2" stroke-width="3"/>
<circle cx="150" cy="126" r="7" fill="#A2A3A5"/>
<circle cx="98" cy="124" r="11" fill="#3E6AE1" stroke="#FFFFFF" stroke-width="3"/>
<circle cx="202" cy="124" r="11" fill="#3E6AE1" stroke="#FFFFFF" stroke-width="3"/>
<g font-size="15" font-weight="700" text-anchor="middle">
<circle cx="22" cy="22" r="13" fill="#171A20"/><text x="22" y="27" fill="#FFFFFF">1</text>
<circle cx="278" cy="22" r="13" fill="#171A20"/><text x="278" y="27" fill="#FFFFFF">2</text>
<circle cx="98" cy="160" r="13" fill="#171A20"/><text x="98" y="165" fill="#FFFFFF">3</text>
<circle cx="202" cy="160" r="13" fill="#171A20"/><text x="202" y="165" fill="#FFFFFF">4</text>
</g>
</g>
<g id="Wheel-callouts">
<circle cx="105" cy="517" r="13" fill="#171A20"/><text x="105" y="522" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">1</text>
<text x="132" y="522" font-size="19" font-weight="700" fill="#171A20">Left paddle · mode down</text>
<text x="132" y="544" font-size="16" fill="#5C5E62">Dynamic → Normal → Eco</text>
<circle cx="105" cy="572" r="13" fill="#171A20"/><text x="105" y="577" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">2</text>
<text x="132" y="577" font-size="19" font-weight="700" fill="#171A20">Right paddle · mode up</text>
<text x="132" y="599" font-size="16" fill="#5C5E62">Eco → Normal → Dynamic</text>
<circle cx="105" cy="627" r="13" fill="#171A20"/><text x="105" y="632" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">3</text>
<text x="132" y="632" font-size="19" font-weight="700" fill="#171A20">Left button · less regen</text>
<text x="132" y="654" font-size="16" fill="#5C5E62">Off · Low · Medium · Maximum</text>
<circle cx="105" cy="682" r="13" fill="#171A20"/><text x="105" y="687" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">4</text>
<text x="132" y="687" font-size="19" font-weight="700" fill="#171A20">Right button · more regen</text>
<text x="132" y="709" font-size="16" fill="#5C5E62">Maximum lets you drive with one pedal</text>
</g>
</g>

<g id="Shifter">
<rect x="528.5" y="196.5" width="550" height="564" rx="20" fill="#FFFFFF" stroke="#E4E5E7"/>
<text x="556" y="236" font-size="15" font-weight="700" letter-spacing="1.2" fill="#5C5E62">SHIFTER</text>
<g id="Shifter-drawing" transform="translate(557 254) scale(1.45)">
<rect x="18" y="4" width="124" height="190" rx="38" fill="#F7F7F8" stroke="#D0D1D2" stroke-width="2"/>
<rect x="32" y="12" width="96" height="70" rx="12" fill="#E4E5E7" stroke="#D0D1D2" stroke-width="1.5"/>
<path d="M80 86 V112 M67 99 H93" fill="none" stroke="#D0D1D2" stroke-width="11" stroke-linecap="round"/>
<path d="M80 89 V96 M80 102 V109" fill="none" stroke="#3E6AE1" stroke-width="7" stroke-linecap="round"/>
<circle cx="116" cy="124" r="9" fill="#F1D0D0"/>
<circle cx="80" cy="28" r="9" fill="#3E6AE1" stroke="#FFFFFF" stroke-width="2"/>
<circle cx="60" cy="46" r="8" fill="#D0D1D2"/>
<circle cx="100" cy="46" r="8" fill="#D0D1D2"/>
<circle cx="80" cy="64" r="9" fill="#3E6AE1" stroke="#FFFFFF" stroke-width="2"/>
<circle cx="44" cy="124" r="9" fill="#D64545" stroke="#FFFFFF" stroke-width="2"/>
<circle cx="68" cy="124" r="9" fill="#D64545" stroke="#FFFFFF" stroke-width="2"/>
<circle cx="92" cy="124" r="9" fill="#D64545" stroke="#FFFFFF" stroke-width="2"/>
<g font-size="8" font-weight="700" text-anchor="middle" fill="#FFFFFF">
<text x="44" y="127">1</text><text x="68" y="127">2</text><text x="92" y="127">3</text>
</g>
<g fill="none" stroke="#3E6AE1" stroke-width="1.5" stroke-linejoin="round">
<path d="M91 28 H160 L172 10 H178"/>
<path d="M91 64 H154 L172 18 H178"/>
<path d="M95 99 H150 L170 52 H178"/>
</g>
<g fill="none" stroke="#D64545" stroke-width="1.5" stroke-linejoin="round">
<path d="M92 135 V139 H160 L170 88 H178"/>
<path d="M68 135 V145 H156 L170 124 H178"/>
<path d="M44 135 V151 H152 L170 160 H178"/>
</g>
<text x="182" y="12" font-size="13" font-weight="700" fill="#171A20">+5 / −5</text>
<text x="182" y="25" font-size="10.5" fill="#393C41">Top up, bottom down:</text>
<text x="182" y="37" font-size="10.5" fill="#393C41">the set speed, 5 km/h a step</text>
<text x="182" y="56" font-size="13" font-weight="700" fill="#171A20">GAP ▲ ▼</text>
<text x="182" y="69" font-size="10.5" fill="#393C41">Up closer · down further</text>
<text x="182" y="92" font-size="13" font-weight="700" fill="#171A20">3 · AUTOPILOT</text>
<text x="182" y="105" font-size="10.5" fill="#393C41">Drives for you, in D</text>
<text x="182" y="128" font-size="13" font-weight="700" fill="#171A20">2 · ACC</text>
<text x="182" y="141" font-size="10.5" fill="#393C41">Adaptive cruise</text>
<text x="182" y="164" font-size="13" font-weight="700" fill="#171A20">1 · CC</text>
<text x="182" y="177" font-size="10.5" fill="#393C41">Cruise control</text>
</g>
<line x1="556" y1="555.5" x2="1051" y2="555.5" stroke="#E4E5E7"/>
<g id="Gear-gate" transform="translate(556 571)" font-family="'Barlow Semi Condensed', sans-serif" font-weight="700" text-anchor="middle">
<path d="M30 18 V78 M100 18 V78 M170 18 V78 M30 48 H170" fill="none" stroke="#D0D1D2" stroke-width="6" stroke-linecap="round"/>
<rect x="12" y="2" width="36" height="32" rx="8" fill="#171A20"/><text x="30" y="26" font-size="22" fill="#FFFFFF">P</text>
<rect x="82" y="2" width="36" height="32" rx="8" fill="#171A20"/><text x="100" y="26" font-size="22" fill="#FFFFFF">D</text>
<rect x="82" y="62" width="36" height="32" rx="8" fill="#171A20"/><text x="100" y="86" font-size="22" fill="#FFFFFF">R</text>
<rect x="13" y="63" width="34" height="30" rx="8" fill="#FFFFFF" stroke="#D0D1D2" stroke-width="2"/><text x="30" y="86" font-size="20" fill="#8E8E93">N</text>
<rect x="153" y="3" width="34" height="30" rx="8" fill="#FFFFFF" stroke="#D0D1D2" stroke-width="2"/><text x="170" y="26" font-size="20" fill="#8E8E93">N</text>
<rect x="153" y="63" width="34" height="30" rx="8" fill="#FFFFFF" stroke="#D0D1D2" stroke-width="2"/><text x="170" y="86" font-size="20" fill="#8E8E93">N</text>
</g>
<text x="784" y="600" font-size="19" font-weight="700" fill="#171A20">Works like an automatic</text>
<text x="784" y="624" font-size="16" fill="#5C5E62">1st slot is P, 3rd is D, 4th is R.</text>
<text x="784" y="646" font-size="16" fill="#5C5E62">Any other slot or the middle is N.</text>
<text x="784" y="668" font-size="16" fill="#5C5E62">In P the hand brake holds the car.</text>
</g>

<g id="Pedals">
<rect x="1103.5" y="196.5" width="419" height="564" rx="20" fill="#FFFFFF" stroke="#E4E5E7"/>
<text x="1131" y="236" font-size="15" font-weight="700" letter-spacing="1.2" fill="#5C5E62">PEDALS</text>
<g id="Pedal-drawing" transform="translate(1163 254)">
<line x1="10" y1="160" x2="290" y2="160" stroke="#D0D1D2" stroke-width="3" stroke-linecap="round"/>
<rect x="24" y="54" width="62" height="88" rx="12" fill="#FFFFFF" stroke="#A2A3A5" stroke-width="3"/>
<rect x="114" y="54" width="70" height="88" rx="12" fill="#D97706"/>
<rect x="214" y="28" width="58" height="114" rx="12" fill="#3E6AE1"/>
<g font-size="12" font-weight="700" letter-spacing="1.2" text-anchor="middle">
<text x="55" y="180" fill="#5C5E62">CLUTCH</text>
<text x="149" y="180" fill="#171A20">BRAKE</text>
<text x="243" y="180" fill="#171A20">ACCELERATOR</text>
</g>
</g>
<g id="Pedal-callouts">
<rect x="1131" y="458" width="18" height="18" rx="5" fill="#3E6AE1"/>
<text x="1163" y="472" font-size="19" font-weight="700" fill="#171A20">Accelerator</text>
<text x="1163" y="494" font-size="16" fill="#5C5E62">With an assist on, press it to go faster.</text>
<text x="1163" y="516" font-size="16" fill="#5C5E62">Let go and the assist carries on. Lift off</text>
<text x="1163" y="538" font-size="16" fill="#5C5E62">and regen slows the car.</text>
<rect x="1131" y="566" width="18" height="18" rx="5" fill="#D97706"/>
<text x="1163" y="580" font-size="19" font-weight="700" fill="#171A20">Brake</text>
<text x="1163" y="602" font-size="16" fill="#5C5E62">Puts cruise and adaptive cruise on standby.</text>
<text x="1163" y="624" font-size="16" fill="#5C5E62">A firm press takes over from the autopilot.</text>
<rect x="1132" y="653" width="16" height="16" rx="4" fill="none" stroke="#A2A3A5" stroke-width="2"/>
<text x="1163" y="666" font-size="19" font-weight="700" fill="#171A20">Clutch</text>
<text x="1163" y="688" font-size="16" fill="#5C5E62">Not needed. Pressing it cuts the power</text>
<text x="1163" y="710" font-size="16" fill="#5C5E62">and cancels cruise.</text>
</g>
</g>

<g id="Assists">
<g id="Cruise-control">
<rect x="65" y="786" width="468" height="230" rx="16" fill="#FFFFFF" stroke="#E4E5E7" stroke-width="2"/>
<text x="88" y="830" font-size="26" font-weight="600" fill="#171A20">Cruise control</text>
<rect x="338" y="808" width="171" height="27" rx="13.5" fill="#EAF0FD"/>
<text x="423.5" y="826" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="0.84" fill="#3E6AE1">HOLDS YOUR SPEED</text>
<g font-size="14" font-weight="700" letter-spacing="1.1" fill="#5C5E62">
<text x="88" y="868">ON</text><text x="88" y="900">ADJUST</text><text x="88" y="932">PAUSE</text><text x="88" y="964">OFF</text>
</g>
<g font-size="18" fill="#171A20">
<text x="196" y="869">Red button <tspan font-weight="700">1 · CC</tspan>, from 20 km/h in D</text>
<text x="196" y="901"><tspan font-weight="700">+5 / −5</tspan> set speed</text>
<text x="196" y="933">Brake pauses it, <tspan font-weight="700">CC</tspan> resumes</text>
<text x="196" y="965"><tspan font-weight="700">CC</tspan> again</text>
</g>
<text x="88" y="994" font-size="16" fill="#5C5E62">Throttle only: it never brakes for you.</text>
</g>
<g id="Adaptive-cruise">
<rect x="559.3" y="786" width="468" height="230" rx="16" fill="#FFFFFF" stroke="#E4E5E7" stroke-width="2"/>
<text x="582.3" y="830" font-size="26" font-weight="600" fill="#171A20">Adaptive cruise</text>
<rect x="803.3" y="808" width="200" height="27" rx="13.5" fill="#EAF0FD"/>
<text x="903.3" y="826" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="0.84" fill="#3E6AE1">KEEPS YOUR DISTANCE</text>
<g font-size="14" font-weight="700" letter-spacing="1.1" fill="#5C5E62">
<text x="582.3" y="868">ON</text><text x="582.3" y="900">ADJUST</text><text x="582.3" y="932">PAUSE</text><text x="582.3" y="964">OFF</text>
</g>
<g font-size="18" fill="#171A20">
<text x="690.3" y="869">Red button <tspan font-weight="700">2 · ACC</tspan>, from 20 km/h in D</text>
<text x="690.3" y="901"><tspan font-weight="700">+5 / −5</tspan> speed · <tspan font-weight="700">GAP ▲ ▼</tspan> distance</text>
<text x="690.3" y="933">Brake pauses it, <tspan font-weight="700">ACC</tspan> resumes</text>
<text x="690.3" y="965"><tspan font-weight="700">ACC</tspan> again</text>
</g>
<text x="582.3" y="998" font-size="16" fill="#5C5E62">Brakes for the car ahead, down to a stop.</text>
</g>
<g id="Autopilot">
<rect x="1053.7" y="786" width="468" height="230" rx="16" fill="#EAF0FD" stroke="#3E6AE1" stroke-width="2"/>
<text x="1076.7" y="830" font-size="26" font-weight="600" fill="#171A20">Autopilot</text>
<rect x="1343.7" y="808" width="154" height="27" rx="13.5" fill="#3E6AE1"/>
<text x="1420.7" y="826" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="0.84" fill="#FFFFFF">DRIVES FOR YOU</text>
<g font-size="14" font-weight="700" letter-spacing="1.1" fill="#5C5E62">
<text x="1076.7" y="868">ON</text><text x="1076.7" y="900">ADJUST</text><text x="1076.7" y="932">TAKE OVER</text><text x="1076.7" y="964">OFF</text>
</g>
<g font-size="18" fill="#171A20">
<text x="1184.7" y="869">Red button <tspan font-weight="700">3 · AUTOPILOT</tspan>, in D</text>
<text x="1184.7" y="901"><tspan font-weight="700">+5 / −5</tspan> speed · <tspan font-weight="700">GAP ▲ ▼</tspan> distance</text>
<text x="1184.7" y="933">Brake, steer firmly, or leave D</text>
<text x="1184.7" y="965"><tspan font-weight="700">AUTOPILOT</tspan> again</text>
</g>
<text x="1076.7" y="998" font-size="16" fill="#5C5E62">The accelerator speeds it up while it steers.</text>
</g>
</g>

<g id="Footer" font-size="16" fill="#5C5E62">
<rect x="64" y="1047" width="14" height="14" rx="4" fill="#3E6AE1"/>
<text x="86" y="1059">Blue: the car helps</text>
<rect x="250" y="1047" width="14" height="14" rx="4" fill="#D97706"/>
<text x="272" y="1059">Amber: you take control</text>
<rect x="484" y="1047" width="14" height="14" rx="7" fill="#D64545"/>
<text x="506" y="1059">Red: the assists</text>
<text x="660" y="1059">One assist at a time · rising chime on, falling chime off</text>
<text x="1523" y="1059" text-anchor="end">Study staff: B starts the manual, F the free drive, hold R to stop it</text>
</g>
</svg>
